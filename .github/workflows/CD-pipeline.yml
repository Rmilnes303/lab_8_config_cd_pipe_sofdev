name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Only deploy if the CI run passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:${{ github.event.workflow_run.head_sha }}
    steps:
      # workflow_run checks out the default branch unless told otherwise,
      # so pin it to the commit that CI tested
      - name: Checkout code at the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Minikube and kubectl if missing
        run: |
          if ! command -v minikube >/dev/null 2>&1; then
            curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            sudo install minikube-linux-amd64 /usr/local/bin/minikube
            rm minikube-linux-amd64
          fi
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install kubectl /usr/local/bin/kubectl
            rm kubectl
          fi

      - name: Start Minikube
        run: |
          minikube status >/dev/null 2>&1 || minikube start --driver=docker

      - name: Deploy to Minikube
        run: |
          sed "s|__IMAGE__|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/calculator-app --timeout=120s

      - name: Show access URL
        run: echo "App available at http://$(minikube ip):30080"
